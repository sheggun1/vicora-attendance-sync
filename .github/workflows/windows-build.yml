name: VICORA Attendance Sync - Windows Cloud Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VICORA-Attendance-Sync-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
